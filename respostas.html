<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Respostas da equipe · Livro dos Enigmas</title>
    <link rel="stylesheet" href="css/livro.css?v=2.8.2">
    <link rel="stylesheet" href="css/controle.css?v=2.8.2">
</head>

<body>
    <main class="control-shell">
        <header class="control-header">
            <div>
                <p class="eyebrow">Livro dos Enigmas</p>
                <h1>Respostas da equipe</h1>
                <div id="team-label"></div>
            </div><a id="back" class="subtle-button">Índice</a>
        </header>
        <p id="status" role="status">Consultando respostas...</p>
        <section id="results" hidden>
            <div class="toolbar"><strong id="points"></strong></div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Enigma</th>
                            <th>Resposta enviada</th>
                            <th>Gabarito</th>
                            <th>Resultado</th>
                            <th>Pontos obtidos</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="js/resultados.js?v=2.8.2"></script>
</body>

</html>

<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Salve a Bandeira · Livro dos Enigmas</title>
    <link rel="stylesheet" href="../../css/livro.css?v=2.8.2">
    <style>
        .pyramid-figure {
            margin: 28px auto;
            max-width: 460px;
            text-align: center
        }

        .pyramid-figure img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .enigma-content blockquote {
            margin: 22px 0;
            padding: 10px 20px;
            border-left: 3px solid #9c7339;
            font-style: italic
        }

        .sequence-instruction {
            text-align: center;
            margin: 28px 0 18px
        }

        .scoreboard-answer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(6px, 2vw, 18px);
            margin: 24px auto;
            color: #633d28;
        }
        .scoreboard-answer .score-flag {
            display: block;
            width: clamp(62px, 18vw, 150px);
            height: clamp(32px, 8vw, 65px);
            object-fit: contain;
            flex: 0 1 auto;
            min-width: 0;
        }
        .scoreboard-answer .number-box {
            box-sizing: border-box;
            width: clamp(40px, 10vw, 62px);
            min-width: 0;
            flex: 0 0 auto;
            text-align: center;
            color: #633d28;
        }
        .score-separator { font-size: 1.5rem; flex: 0 0 auto; }
    </style>
</head>

<body data-enigma="18">
    <main class="book page-shell">
        <div class="book-inner">
            <nav class="nav-pages nav-top"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
            <header class="page-head"><span class="page-count" id="page-count"></span><span class="team-label"
                    id="team-label"></span></header>
            <h1 class="page-title" id="book-title"></h1>
            <p id="enigma-points" class="enigma-value" aria-live="polite"></p>
            <div class="flourish" aria-hidden="true">✦ ✧ ✦</div>
            <section class="enigma-content">
                <p class="intro">No jogo "Salve a Bandeira", o objetivo é capturar o máximo de bandeiras possíveis do time adversário em 5 minutos.</p>
                <p>Nos últimos jogos do campeonato mundial de "Salve a Bandeira" foram registrados os seguinte resultados:</p>
                
                <figure class="img-placar"><img src="Placar1.png" width="100%"></figure>
                <figure class="img-placar"><img src="Placar2.png" width="100%"></figure>
                <figure class="img-placar"><img src="Placar3.png" width="100%"></figure>
                <figure class="img-placar"><img src="Placar4.png" width="100%"></figure>

                <p>Qual o placar do próximo jogo?</p>
                <div class="scoreboard-answer" role="group" aria-label="Placar de Canadá contra Índia">
                    <img class="score-flag" src="bandeira_Canada.png" alt="Bandeira do Canadá">
                    <input data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                        autocomplete="off" placeholder="0" aria-label="Placar do Canadá">
                    <span class="score-separator" aria-hidden="true">X</span>
                    <input data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                        autocomplete="off" placeholder="0" aria-label="Placar da Índia">
                    <img class="score-flag" src="bandeira_india.png" alt="Bandeira da Índia">
                </div>
                <div id="lock-banner" class="status-banner" hidden role="status"></div>
                <div class="answer-actions"><button id="submit-answer" class="gold-button">Enviar resposta</button></div>
                <div id="sending-indicator" class="sending-indicator" hidden aria-label="Envio em andamento">
                    <span></span></div>
                <p id="message" class="message" role="status"></p>
            </section>
            <nav class="nav-pages"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
        </div>
    </main>
    <script type="module" src="enigma.js?v=18.1"></script>
</body>

</html>

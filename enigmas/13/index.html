<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A paisagem fragmentada · Livro dos Enigmas</title>
    <link rel="stylesheet" href="../../css/livro.css">
<link rel="stylesheet" href="estilo.css">
</head>

<body data-enigma="13">
    <main class="book page-shell">
        <div class="book-inner">
            <nav class="nav-pages nav-top"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
            <header class="page-head"><span class="page-count" id="page-count"></span><span class="team-label"
                    id="team-label"></span></header>
            <h1 class="page-title" id="book-title"></h1>
            <p id="enigma-points" class="enigma-value" aria-live="polite"></p>
            <div class="flourish" aria-hidden="true">✦ ✧ ✦</div>            
            <section class="enigma-content">
                <p class="intro">Os dias ensolarados convidam para um passeio pelas trilhas do Reino.</p>
                <p>Mova as peças para recontruir a imagem.</p>
                <p id="puzzle-status" class="puzzle-status" role="status" aria-live="polite">Embaralhando as peças...</p>
                <div id="puzzle" class="puzzle" data-image="imagem.png" role="group" aria-label="Quebra-cabeça deslizante de cinco por cinco"></div>
                <div id="lock-banner" class="status-banner" hidden></div>
                <div class="answer-actions"><button id="submit-answer" class="gold-button" disabled>Enviar resposta</button></div>
                <div id="sending-indicator" class="sending-indicator" hidden><span></span></div>
                <p id="message" class="message" role="status"></p>
            </section>
            <nav class="nav-pages"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
        </div>
    </main>
    <script type="module" src="enigma.js"></script>
</body>

</html>

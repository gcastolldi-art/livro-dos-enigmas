<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A sequência dos sete · Livro dos Enigmas</title>
    <link rel="stylesheet" href="../../css/livro.css">
</head>

<body data-enigma="sequencia-dos-sete">
    <main class="book page-shell">
        <div class="book-inner">
            <header class="page-head"><span class="page-count" id="page-count"></span><span class="team-label"
                    id="team-label"></span></header>
            <h1 class="page-title" id="book-title"></h1>
            <div class="flourish" aria-hidden="true">✦ ✧ ✦</div>
            <section class="enigma-content">
                <p class="intro">Sete posições guardam a sequência que abrirá o próximo selo.</p>
                <p>Modelo de enigma com resposta numérica. Substitua este texto pelas pistas do desafio. Preencha cada
                    posição com um número de 0 a 99, seguindo a ordem da esquerda para a direita.</p>
                <div class="number-sequence" role="group" aria-label="Sequência de sete números"><label>1<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Primeiro número"></label><label>2<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Segundo número"></label><label>3<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Terceiro número"></label><label>4<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Quarto número"></label><label>5<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Quinto número"></label><label>6<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Sexto número"></label><label>7<input
                            data-answer-input class="number-box" inputmode="numeric" type="text" maxlength="2"
                            autocomplete="off" placeholder="00" aria-label="Sétimo número"></label></div>
                <div id="lock-banner" class="status-banner" hidden role="status"></div>
                <div class="answer-actions"><button id="submit-answer" class="gold-button">Enviar resposta</button></div>
                <div id="sending-indicator" class="sending-indicator" hidden aria-label="Envio em andamento">
                    <span></span></div>
                <p id="message" class="message" role="status"></p>
            </section>
            <nav class="nav-pages"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
        </div>
    </main>
    <script type="module" src="enigma.js"></script>
</body>

</html>

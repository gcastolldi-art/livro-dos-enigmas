<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A ordem dos símbolos · Livro dos Enigmas</title>
    <link rel="stylesheet" href="../../css/livro.css">
</head>

<body data-enigma="3">
    <main class="book page-shell">
        <div class="book-inner">
            <header class="page-head"><span class="page-count" id="page-count"></span><span class="team-label"
                    id="team-label"></span></header>
            <h1 class="page-title" id="book-title"></h1>
            <div class="flourish" aria-hidden="true">✦ ✧ ✦</div>
            <p id="enigma-points" class="enigma-value" aria-live="polite"></p>
            <section class="enigma-content">
                <p class="intro">Página piloto de ordenação. Arraste as peças ou use as setas no celular.</p>
                <p>Disponha os símbolos na ordem em que a história os revelou: primeiro a noite, depois a luz, por fim o
                    saber.</p>
                <ol id="pieces" class="sort-list">
                    <li class="sort-item" data-value="livro" data-answer-input draggable="true"><span
                            class="symbol">▤</span>Livro <span class="sort-controls"><button type="button"
                                aria-label="Mover livro para cima" data-move="up">↑</button><button type="button"
                                aria-label="Mover livro para baixo" data-move="down">↓</button></span></li>
                    <li class="sort-item" data-value="eclipse" data-answer-input draggable="true"><span
                            class="symbol">◐</span>Eclipse <span class="sort-controls"><button type="button"
                                aria-label="Mover eclipse para cima" data-move="up">↑</button><button type="button"
                                aria-label="Mover eclipse para baixo" data-move="down">↓</button></span></li>
                    <li class="sort-item" data-value="estrela" data-answer-input draggable="true"><span
                            class="symbol">✦</span>Estrela <span class="sort-controls"><button type="button"
                                aria-label="Mover estrela para cima" data-move="up">↑</button><button type="button"
                                aria-label="Mover estrela para baixo" data-move="down">↓</button></span></li>
                </ol>
                <div id="lock-banner" class="status-banner" hidden></div>
                <div class="answer-actions"><button id="submit-answer" class="gold-button">Enviar resposta</button></div>
                <div id="sending-indicator" class="sending-indicator" hidden aria-label="Envio em andamento"><span></span></div><p id="message" class="message" role="status"></p>
            </section>
            <nav class="nav-pages"><a id="prev"></a><a id="index-link">Índice</a><a id="next"></a></nav>
        </div>
    </main>
    <script type="module" src="enigma.js"></script>
</body>

</html>
